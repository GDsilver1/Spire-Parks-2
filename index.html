<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#213937">
  <meta name="description" content="Spire Parks 2 — build and test your own 3D roller coasters.">
  <link rel="icon" href="data:,">
  <title>Spire Parks 2</title>
  <link rel="stylesheet" href="./assets/game.css">
  <style>
    html, body, #viewport {
      margin: 0;
      width: 100%;
      height: 100%;
    }
    html, body {
      overflow: hidden;
      overscroll-behavior: none;
      background: #000;
    }
    #viewport {
      --surface-viewport-safe-top: env(safe-area-inset-top, 0px);
      --surface-viewport-safe-right: env(safe-area-inset-right, 0px);
      --surface-viewport-safe-bottom: env(safe-area-inset-bottom, 0px);
      --surface-viewport-safe-left: env(safe-area-inset-left, 0px);
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }
    #app {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      transform-origin: 0 0;
    }
    :where(#app > canvas) {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="viewport">
    <div id="app"></div>
  </div>
  <script type="module" src="./assets/game.js"></script>
</body>
</html>
